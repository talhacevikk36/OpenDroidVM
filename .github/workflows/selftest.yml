name: selftest
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/selftest.yml"]
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-arm
      - run: python -m pip install .
      - name: odvm selftest (downloads Alpine netboot, boots it in QEMU)
        run: |
          set +e
          odvm selftest --yes --timeout 240 2>&1 | tee out.txt
          RC=${PIPESTATUS[0]}
          echo "::notice::selftest rc=$RC :: $(tail -c 1800 out.txt | tr '\n' '|')"
          echo "--- positive control: scan the known-good kernel"
          K=$(find ~/.cache -name vmlinuz-virt | head -1)
          odvm check "$K" 2>&1 | tee check.txt
          echo "::notice::control scan :: $(tr '\n' '|' < check.txt)"
          exit 0
