[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opendroidvm"
version = "0.9.1a1"
description = "Try Android recoveries and ROMs on QEMU using device profiles"
readme = "README.md"
requires-python = ">=3.9"
classifiers = ["Development Status :: 3 - Alpha"]
license = {text = "GPL-2.0-or-later"}
dependencies = []

[project.scripts]
odvm = "opendroidvm.cli:main"
opendroidvm = "opendroidvm.cli:main"

[tool.setuptools]
packages = ["opendroidvm"]

[tool.setuptools.package-data]
opendroidvm = ["profiles/*.json"]
